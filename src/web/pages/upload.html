<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drishti — Image Upload</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #18181a;
    --surface2: #222224;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text: #f0ede8;
    --muted: #888782;
    --accent: #5DCAA5;
    --accent-dim: rgba(93,202,165,0.12);
    --accent-border: rgba(93,202,165,0.35);
    --danger: #E24B4A;
    --danger-dim: rgba(226,75,74,0.12);
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .wordmark {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  .wordmark span { color: var(--accent); }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
  }

  h1 {
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .drop-zone {
    border: 1px dashed var(--border-hover);
    border-radius: 12px;
    padding: 3rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    background: var(--surface2);
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent-border);
    background: var(--accent-dim);
  }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 1rem;
    border: 0.5px solid var(--border-hover);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
  }

  .drop-icon svg { color: var(--accent); }

  .drop-label {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .drop-hint {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }

  .preview-area {
    display: none;
    margin-top: 1.5rem;
    border-radius: 10px;
    overflow: hidden;
    border: 0.5px solid var(--border);
    position: relative;
  }

  .preview-area img {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    display: block;
  }

  .preview-name {
    padding: 10px 14px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    background: var(--surface2);
    border-top: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-family: var(--mono);
    padding: 0;
    transition: color 0.15s;
  }
  .remove-btn:hover { color: var(--danger); }

  .dir-row {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .dir-label {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .dir-input {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 14px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }

  .dir-input:focus { border-color: var(--accent-border); }

  .row-2col {
    margin-top: 1.5rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  select.dir-input {
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23888782' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    cursor: pointer;
  }

  .toggle-group {
    display: flex;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    height: 40px;
  }

  .toggle-group input[type="radio"] { display: none; }

  .toggle-group label {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }

  .toggle-group input[type="radio"]:checked + label {
    background: var(--accent-dim);
    color: var(--accent);
    border: 0.5px solid var(--accent-border);
  }

  .tuned-weights-row {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.25s ease, opacity 0.2s ease, margin-top 0.25s ease;
    margin-top: 0;
  }

  .tuned-weights-row.visible {
    max-height: 80px;
    opacity: 1;
    margin-top: 1.5rem;
  }

  .labels-area {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .labels-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .add-label-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    transition: opacity 0.15s;
  }
  .add-label-btn:hover { opacity: 0.7; }

  .labels-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .label-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .label-item input {
    flex: 1;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  .label-item input:focus { border-color: var(--accent-border); }

  .del-label-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    font-family: var(--mono);
    padding: 0;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .del-label-btn:hover { color: var(--danger); }

  .upload-btn {
    margin-top: 1.5rem;
    width: 100%;
    background: var(--accent);
    color: #04342C;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-weight: 500;
  }

  .upload-btn:hover { opacity: 0.88; }
  .upload-btn:active { transform: scale(0.99); }
  .upload-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .status {
    display: none;
    margin-top: 1.5rem;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    font-size: 13px;
    font-family: var(--mono);
  }

  .status.loading {
    display: block;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    color: var(--muted);
  }

  .status.success {
    display: block;
    background: var(--accent-dim);
    border: 0.5px solid var(--accent-border);
    color: var(--accent);
  }

  .status.error {
    display: block;
    background: var(--danger-dim);
    border: 0.5px solid rgba(226,75,74,0.35);
    color: var(--danger);
  }

  .results-table {
    margin-top: 1rem;
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .results-table th {
    text-align: left;
    color: var(--muted);
    padding: 4px 0;
    font-weight: 400;
    border-bottom: 0.5px solid var(--border);
  }

  .results-table td {
    padding: 6px 0;
    border-bottom: 0.5px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }

  .results-table td:last-child { color: var(--accent); text-align: right; }

  .spinner {
    display: inline-block;
    width: 10px; height: 10px;
    border: 1.5px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="wordmark">drishti / <span>clip inference</span></div>

<div class="card">
  <h1>Upload query image</h1>
  <p class="subtitle">Image is saved to the target directory and run through CLIP inference.</p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/*">
    <div class="drop-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <p class="drop-label">Drop image here or click to browse</p>
    <p class="drop-hint">jpg · png · webp · gif</p>
  </div>

  <div class="preview-area" id="previewArea">
    <img id="previewImg" src="" alt="preview">
    <div class="preview-name">
      <span id="previewName"></span>
      <button class="remove-btn" id="removeBtn">remove</button>
    </div>
  </div>

  <div class="dir-row">
    <label class="dir-label" for="dirInput">target directory</label>
    <input class="dir-input" type="text" id="dirInput" value="data/inference/query_images" placeholder="data/inference/query_images">
  </div>

  <div class="row-2col">
    <div class="field">
      <label class="dir-label" for="modelSelect">model</label>
      <select class="dir-input" id="modelSelect">
        <option value="ViT-B/32">ViT-B/32</option>
        <option value="ViT-B/16">ViT-B/16</option>
        <option value="ViT-L/14">ViT-L/14</option>
        <option value="RN50">RN50</option>
        <option value="RN101">RN101</option>
      </select>
    </div>

    <div class="field">
      <label class="dir-label">weights</label>
      <div class="toggle-group">
        <input type="radio" name="tuned" id="base" value="base" checked>
        <label for="base">base</label>
        <input type="radio" name="tuned" id="tuned" value="tuned">
        <label for="tuned">tuned</label>
      </div>
    </div>
  </div>

  <div class="tuned-weights-row" id="tunedWeightsRow">
    <label class="dir-label" for="weightsInput">tuned weights path</label>
    <input class="dir-input" type="text" id="weightsInput" placeholder="checkpoints/clip_finetuned.pt">
  </div>

  <div class="labels-area">
    <div class="labels-header">
      <span class="dir-label">labels</span>
      <button class="add-label-btn" id="addLabelBtn">+ add</button>
    </div>
    <div class="label-item" id="pasteRow">
      <input class="dir-input" type="text" id="pasteInput" placeholder='paste JSON array  ["label1", "label2"]' style="font-size:12px; padding: 8px 12px;">
      <button class="add-label-btn" id="pasteBtn" style="white-space:nowrap; padding: 0 4px;">import</button>
    </div>
    <div class="labels-list" id="labelsList">
      <div class="label-item">
        <input type="text" placeholder="e.g. a photo of a cat" value="inanimate objects with no people present">
        <button class="del-label-btn" title="remove">×</button>
      </div>
      <div class="label-item">
        <input type="text" placeholder="e.g. a photo of a dog" value="a person or people present">
        <button class="del-label-btn" title="remove">×</button>
      </div>
    </div>
  </div>

  <button class="upload-btn" id="uploadBtn" disabled>run inference</button>

  <div class="status" id="status"></div>
</div>

<script>
  const dropZone    = document.getElementById('dropZone');
  const fileInput   = document.getElementById('fileInput');
  const previewArea = document.getElementById('previewArea');
  const previewImg  = document.getElementById('previewImg');
  const previewName = document.getElementById('previewName');
  const removeBtn   = document.getElementById('removeBtn');
  const uploadBtn   = document.getElementById('uploadBtn');
  const dirInput    = document.getElementById('dirInput');
  const modelSelect = document.getElementById('modelSelect');
  const labelsList  = document.getElementById('labelsList');
  const addLabelBtn = document.getElementById('addLabelBtn');
  const status      = document.getElementById('status');

  const tunedWeightsRow = document.getElementById('tunedWeightsRow');
  const weightsInput    = document.getElementById('weightsInput');

  document.querySelectorAll('input[name="tuned"]').forEach(radio => {
    radio.addEventListener('change', () => {
      if (radio.value === 'tuned' && radio.checked) {
        tunedWeightsRow.classList.add('visible');
        weightsInput.focus();
      } else {
        tunedWeightsRow.classList.remove('visible');
      }
    });
  });

  let selectedFile = null;
  let uploadedFile = null;

  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) setFile(e.target.files[0]);
  });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewArea.style.display = 'block';
      previewName.textContent = file.name;
      uploadBtn.disabled = false;
    };
    reader.readAsDataURL(file);
    status.className = 'status';
  }

  removeBtn.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    previewArea.style.display = 'none';
    previewImg.src = '';
    uploadBtn.disabled = true;
    status.className = 'status';
  });

  function addLabel(value = '') {
    const item = document.createElement('div');
    item.className = 'label-item';
    item.innerHTML = `
      <input type="text" placeholder="e.g. a photo of a cat" value="${value}">
      <button class="del-label-btn" title="remove">×</button>
    `;
    item.querySelector('.del-label-btn').addEventListener('click', () => {
      if (labelsList.children.length > 1) item.remove();
    });
    labelsList.appendChild(item);
    item.querySelector('input').focus();
  }

  const pasteInput = document.getElementById('pasteInput');
  const pasteBtn   = document.getElementById('pasteBtn');

  function importFromArray(raw) {
    try {
      const arr = JSON.parse(raw.trim());
      if (!Array.isArray(arr)) throw new Error();
      arr.map(l => String(l).trim()).filter(Boolean).forEach(addLabel);
      pasteInput.value = '';
      pasteInput.style.borderColor = '';
    } catch {
      pasteInput.style.borderColor = 'var(--danger)';
      setTimeout(() => pasteInput.style.borderColor = '', 1500);
    }
  }

  pasteBtn.addEventListener('click', () => {
    if (pasteInput.value.trim()) importFromArray(pasteInput.value);
  });

  pasteInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && pasteInput.value.trim()) importFromArray(pasteInput.value);
  });

  pasteInput.addEventListener('paste', e => {
    const text = e.clipboardData.getData('text').trim();
    if (text.startsWith('[')) {
      e.preventDefault();
      importFromArray(text);
    }
  });



  labelsList.querySelectorAll('.del-label-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (labelsList.children.length > 1) btn.closest('.label-item').remove();
    });
  });

  function getLabels() {
    return Array.from(labelsList.querySelectorAll('input'))
      .map(i => i.value.trim())
      .filter(Boolean);
  }

  addLabelBtn.addEventListener('click', async () => {
    addLabel()
  });
  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    const labels = getLabels();
    if (!labels.length) {
      status.className = 'status error';
      status.textContent = 'add at least one label before running inference.';
      return;
    }

    uploadBtn.disabled = true;
    status.className = 'status loading';
    status.innerHTML = '<span class="spinner"></span>uploading and running inference...';

    const tuned = document.querySelector('input[name="tuned"]:checked').value;

    const formData = new FormData();
    if (uploadedFile !== selectedFile) {
        formData.append('image',     selectedFile);
        uploadedFile = selectedFile;
    } else {
        formData.append('server-image-name', selectedFile.name);
    }

    formData.append('directory', dirInput.value);
    formData.append('model',     modelSelect.value);
    formData.append('tuned',     tuned);
    if (tuned === 'tuned') formData.append('weights_path', weightsInput.value.trim());
    formData.append('labels',    JSON.stringify(labels));

    try {
      const res  = await fetch('http://localhost:8000/upload', { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Upload failed');

      let html = `saved → <strong>${data.filename}</strong>`;

      if (data.matches && data.matches.length) {
        html += `<table class="results-table">
          <thead><tr><th>label</th><th>score</th></tr></thead>
          <tbody>`;
        data.matches.forEach(m => {
          html += `<tr><td>${m.label}</td><td>${m.score}</td></tr>`;
        });
        html += `</tbody></table>`;
      }

      status.className = 'status success';
      status.innerHTML = html;
    } catch (err) {
      status.className = 'status error';
      status.textContent = err.message;
    } finally {
      uploadBtn.disabled = false;
    }
  });
</script>
</body>
</html>
