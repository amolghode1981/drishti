<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drishti — Batch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0e0e0f;--surface:#18181a;--surface2:#222224;--border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.18);--text:#f0ede8;--muted:#888782;--accent:#5DCAA5;--accent-b:rgba(93,202,165,0.35);--accent-dim:rgba(93,202,165,0.12);--mono:'DM Mono',monospace}
  body{font-family:var(--mono);background:var(--bg);color:var(--text);height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:2rem;display:flex;flex-direction:column;gap:12px;width:360px}
  .wordmark{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
  .wordmark span{color:var(--accent)}
  input,select{background:var(--surface2);border:0.5px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 12px;outline:none;width:100%;transition:border-color .15s}
  input:focus,select:focus{border-color:var(--accent-b)}
  select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23888782' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;cursor:pointer}
  label{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .field{display:flex;flex-direction:column;gap:5px}
  button{background:var(--accent);color:#04342C;border:none;border-radius:7px;padding:10px;font-family:var(--mono);font-size:12px;font-weight:500;cursor:pointer;transition:opacity .15s}
  button:hover{opacity:.85}
  button:disabled{opacity:.4;cursor:not-allowed}
  .status{font-size:11px;color:var(--muted);text-align:center;min-height:16px}
  .status.ok{color:var(--accent)}
  .status.err{color:#E24B4A}
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">drishti / <span>batch inference</span></div>

  <div class="field">
    <label>directory</label>
    <input id="dir" type="text" placeholder="data/inference/Tests" value="data/inference/Tests">
  </div>

  <div class="field">
    <label>model</label>
    <select id="model">
      <option value="ViT-B/32">ViT-B/32</option>
      <option value="ViT-B/16">ViT-B/16</option>
      <option value="ViT-L/14">ViT-L/14</option>
      <option value="RN50">RN50</option>
      <option value="RN101">RN101</option>
    </select>
  </div>

  <div class="field">
    <label>run count per image</label>
    <input id="count" type="number" value="1" min="1">
  </div>

  <button id="btn" onclick="run()">run inference</button>
  <div class="status" id="status"></div>
</div>

<script>
async function run(){
  const btn=document.getElementById('btn');
  const status=document.getElementById('status');
  btn.disabled=true;
  status.className='status';
  status.textContent='starting…';
  try{
    const res=await fetch('/api/batch',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        directory:document.getElementById('dir').value.trim(),
        model:document.getElementById('model').value,
        count:parseInt(document.getElementById('count').value)||1
      })
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'failed');
    status.className='status ok';
    status.textContent='batch started ✓';
  }catch(e){
    status.className='status err';
    status.textContent=e.message;
  }finally{
    btn.disabled=false;
  }
}
</script>
</body>
</html>
